<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Scopone</title>
<style>
body{font-family:system-ui;margin:0;padding:10px;background:#0b6b3a;color:#fff}
.r{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;min-height:60px}
.c{padding:0;background:none;border:3px solid transparent;border-radius:9px}
.c svg,.c img{width:56px;height:auto;display:block;border-radius:6px}
.c.s{border-color:#fc0}.c.t{border-color:#09f}
button.g{padding:12px 18px;font-size:16px;border-radius:8px;border:0;background:#fc0;margin-top:6px}
small{opacity:.85}
</style>
<div id=app>Connessione…</div>
<script>
const S=['♦','♥','♠','♣'],V='A234567FCR';
const val=c=>c%10+1,card=c=>V[c%10]+S[c/10|0];
const name=prompt('Il tuo nome?')||'Giocatore',room=location.hash.slice(1)||'tavolo';
const ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host);
const send=o=>ws.send(JSON.stringify(o));
ws.onopen=()=>send({t:'join',room,name});
ws.onclose=()=>app.textContent='Disconnesso: ricarica la pagina';
let st,sel=null,take=[];
ws.onmessage=e=>{st=JSON.parse(e.data);sel=null;take=[];draw()};
const TC=['#8a6a00','#a02020','#1e5a96','#2a6a2a'];
const SY=[
`<circle r="9" fill="#e8b923" stroke="#8a6a00" stroke-width="1.5"/><circle r="4.5" fill="none" stroke="#8a6a00"/>`,
`<path d="M-8-8h16c0 8-4 12-8 12s-8-4-8-12zM0 4v5M-5 9h10" fill="#d9534f" stroke="#611" stroke-width="1.3" stroke-linejoin="round"/>`,
`<path d="M0-11L2.5 4h-5z" fill="#cfe3f5" stroke="#123" stroke-width="1.2"/><path d="M-7 4h14M0 4v8" stroke="#123" stroke-width="2.2"/>`,
`<rect x="-3.2" y="-10" width="6.4" height="20" rx="3" fill="#6aa84f" stroke="#143" stroke-width="1.2"/><path d="M-3-3h-4M3 3h4" stroke="#143" stroke-width="2"/>`];
const sym=(s,x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})">${SY[s]}</g>`;
const L=[0,[[32,52]],[[32,30],[32,74]],[[32,28],[32,52],[32,76]],[[20,32],[44,32],[20,72],[44,72]],[[20,32],[44,32],[32,52],[20,72],[44,72]],[[20,30],[44,30],[20,52],[44,52],[20,74],[44,74]],[[20,30],[44,30],[20,52],[44,52],[20,74],[44,74],[32,41]]];
function svg(c){
  const v=val(c),s=c/10|0,tc=TC[s];
  let b;
  if(v<=7)b=L[v].map(p=>sym(s,p[0],p[1],v==1?2:v>5?.95:1.1)).join('');
  else b=sym(s,32,24,.9)+`<text x="32" y="56" text-anchor="middle" font-size="26" font-weight="700" fill="${tc}">${'FCR'[v-8]}</text><text x="32" y="68" text-anchor="middle" font-size="8" fill="${tc}">${['FANTE','CAVALLO','RE'][v-8]}</text>`+sym(s,32,84,.9);
  return `<svg viewBox="0 0 64 104"><rect x="1" y="1" width="62" height="102" rx="7" fill="#fbf6e6" stroke="#444"/><rect x="5" y="5" width="54" height="94" rx="4" fill="none" stroke="${tc}" stroke-opacity=".35"/>${b}<text x="9" y="17" font-size="12" font-weight="700" fill="${tc}">${v}</text><text transform="translate(55 91) rotate(180)" font-size="12" font-weight="700" fill="${tc}">${v}</text></svg>`;
}
const btn=(c,cls,fn)=>`<button class="c ${cls}" onclick="${fn}(${c})"><img src="c${c}.png" onerror="this.outerHTML=svg(${c})"></button>`;
function pick(c){
  sel=c;take=[];
  const same=st.table.filter(x=>val(x)==val(c));
  if(same.length==1)take=[same[0]];
  draw();
}
function tk(c){
  if(sel===null)return;
  take=take.includes(c)?take.filter(x=>x!=c):[...take,c];
  draw();
}
function go(){send({t:'play',id:sel,take})}
function draw(){
  const s=st;
  if(s.msg){app.textContent=s.msg+' (tavolo: '+room+')';return}
  const me=s.you,tm=me%2;
  let h=`<div><small>Tavolo: ${room}</small></div><div>Noi <b>${s.total[tm]}</b> – Loro <b>${s.total[1-tm]}</b> &nbsp;<small>scope mano: ${s.scope[tm]}–${s.scope[1-tm]}</small></div>`;
  h+='<div><small>'+s.names.map((n,i)=>`${i==s.turn?'👉 ':''}${n||'(libero)'}${i==me?' (tu)':i==(me+2)%4?' (compagno)':''}: ${s.counts[i]}`).join(' · ')+'</small></div>';
  if(!s.full)h+='<p>In attesa che si colleghino tutti e 4 i giocatori…</p>';
  h+=`<div><small>${s.log}</small></div><div class=r>`;
  h+=s.table.length?s.table.map(c=>btn(c,take.includes(c)?'t':'','tk')).join(''):'<small>Tavolo vuoto</small>';
  h+='</div><div class=r>'+s.hand.map(c=>btn(c,sel===c?'s':'','pick')).join('')+'</div>';
  if(s.over){
    h+=`<p><b>Mano finita</b><br>Noi: ${s.res[tm]}<br>Loro: ${s.res[1-tm]}</p><button class=g onclick="send({t:'next'})">Prossima mano</button>`;
  }else if(s.turn==me&&s.full){
    h+=`<div><small>Tocca a te: scegli una carta, poi le carte da prendere (se ce ne sono).</small></div><button class=g onclick="go()" ${sel===null?'disabled':''}>Gioca</button>`;
  }
  app.innerHTML=h;
}
</script>
